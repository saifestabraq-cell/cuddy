name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: football-analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: football-analysis/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: football-analysis/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics supervision opencv-python-headless scikit-learn

      - name: Frontend typecheck and build
        run: npm run build

      - name: Backend compile check
        working-directory: football-analysis/backend
        run: python -m compileall -q app

      - name: Backend smoke tests
        working-directory: football-analysis/backend
        run: pytest -q tests

      - name: Database migration smoke test
        working-directory: football-analysis/backend
        shell: pwsh
        run: |
          $env:FA_DATA_DIR = "$env:RUNNER_TEMP\cuddy-db-smoke"
          if (Test-Path $env:FA_DATA_DIR) { Remove-Item -Recurse -Force $env:FA_DATA_DIR }
          python -c "from app.db import init_db; init_db(); print('Cuddy database migration OK')"

      - name: Build Python sidecar
        shell: pwsh
        run: ./backend/build_sidecar.ps1

      - name: Verify Tauri sidecar
        shell: pwsh
        run: |
          if (!(Test-Path src-tauri/binaries/fa-sidecar-x86_64-pc-windows-msvc.exe)) {
            throw "Tauri sidecar was not produced."
          }

      - name: Build Windows installer
        run: npm run app:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cuddy-Windows-Installer
          path: football-analysis/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
